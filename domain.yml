version: "3.0"

intents:
  - start
  - greet_am
  - goodbye_am
  - about_us_am
  - vision_am
  - mission_am
  - values_am
  - foundation_am
  - inform_language
  - bot_challenge
  # New intent for the menu button
  - conflict_report_am
  - stop
  - affirm
  - deny
  - new_conflict_report
  - conflict_status



entities:
  - selected_language

slots:
  selected_language:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: selected_language

  attachmentKeys:
    type: text  # We store the input (text or link) here
    mappings:
      - type: from_text
        conditions:
         - active_loop: incident_form
           requested_slot: attachmentKeys
      - type: from_text 
        intent: nlu_fallback 
        conditions:
         - active_loop: incident_form
           requested_slot: attachmentKeys
  title:
    type: text
    mappings:
      - type: from_text
        conditions:
         - active_loop: incident_form
           requested_slot: title  # <--- THIS IS MISSING IN YOUR CODE

  description:
    type: text
    mappings:
      - type: from_text
        conditions:
         - active_loop: incident_form
           requested_slot: description

  severity:
    type: categorical
    values:
      - Low
      - Medium
      - High
    mappings:
      - type: from_text
        conditions:
         - active_loop: incident_form
           requested_slot: severity

  region:
    type: text
    mappings:
      - type: from_text
        conditions:
         - active_loop: incident_form
           requested_slot: region

  zone:
    type: text
    mappings:
      - type: from_text
        conditions:
         - active_loop: incident_form
           requested_slot: zone

  woreda:
    type: text
    mappings:
      - type: from_text
        conditions:
         - active_loop: incident_form
           requested_slot: woreda

  kebele:
    type: text
    mappings:
      - type: from_text
        conditions:
         - active_loop: incident_form
           requested_slot: kebele

  specificArea:
    type: text
    mappings:
      - type: from_text
        conditions:
         - active_loop: incident_form
           requested_slot: specificArea

  contactPhone:
    type: text
    mappings:
      - type: from_text
        conditions:
         - active_loop: incident_form
           requested_slot: contactPhone

  occurredAt:
    type: text
    mappings:
      - type: from_text
        conditions:
         - active_loop: incident_form
           requested_slot: occurredAt

  anonymity:
    type: bool
    mappings:
      - type: from_intent
        value: true
        intent: affirm
        conditions:
         - active_loop: incident_form
           requested_slot: anonymity
      - type: from_intent
        value: false
        intent: deny
        conditions:
         - active_loop: incident_form
           requested_slot: anonymity
      - type: from_text
        conditions:
         - active_loop: incident_form
           requested_slot: anonymity

forms:
  form_get_language:
    required_slots:
      - selected_language
  
  # New Incident Form
  incident_form:
    required_slots:
      - title
      - description
      - severity
      - region
      - zone
      - woreda
      - kebele
      - specificArea
      - occurredAt
      - contactPhone
      - anonymity
      - attachmentKeys

responses:
  utter_ask_selected_language:
  - text: "እባክዎን ቋንቋዎን ይምረጡ / Please select your language:"
    button_type: vertical
    buttons:
      - title: "አማርኛ"
        payload: '/inform_language{{"selected_language":"Amharic"}}'
      - title: "Afaan Oromoo"
        payload: '/inform_language{{"selected_language":"Afaan Oromoo"}}'
      - title: "ትግርኛ"
        payload: '/inform_language{{"selected_language":"Tigrinya"}}'
      - title: "Qafaraf"
        payload: '/inform_language{{"selected_language":"Afar"}}'
      - title: "Soomaaliga"
        payload: '/inform_language{{"selected_language":"Somali"}}'
  
  utter_welcome_am:
  - image: https://upload.wikimedia.org/wikipedia/commons/2/27/Ministry_of_Peace_Logo_Ethiopia.png
    text: እንኳን ወደ ሰላም ሚኒስትር በደህና መጡ። የምናቀርባቸውን አገልግሎቶች በተመለከተ ማንኛውንም መረጃ እየፈለጉ ነው?



  utter_greet_en:
    - text: "Hello! Welcome! How can I assist you today?"
  utter_greet_am:
    - text: "👋 ሰላም! እንኳን ደህና መጡ! እባክዎ ምን ልርዳዎ?"
  utter_greet_om:
    - text: "Akkam! Baga nagaan dhuftan! Maal isin gargaaruu danda'a?"
  utter_greet_ti:
    - text: "ሰላም! እንኳን ደህና መጡ! እባክካ ምን ከይዳለኽ?"

  utter_main_menu_am:
  - text: "ዋና ምናሌ:"
    button_type: vertical
    buttons:
      - title: "🌍 ስለ እኛ"
        payload: "/about_us_am"
      - title: "📝 ግጭት ሪፖርት መስጫ"
        payload: "/conflict_report_am" 
      - title: "🆘 እርዳታ"
        payload: "/help_am"
  
  utter_about_us_am:
    - text: "ስለ ሰላም ሚኒስቴር ምን ማወቅ ይፈልጋሉ?"
      button_type: vertical
      buttons:
        - title: "🔭 Vision"
          payload: "/vision_am"
        - title: "🎯 Mission"
          payload: "/mission_am"
        - title: "💎 Values"
          payload: "/values_am"
        - title: "🏛️ Foundation"
          payload: "/foundation_am"


  utter_conflict_report_am:
    - text: "ግጭት ሪፖርት"
      button_type: vertical
      buttons:
        - title: "➕አዲስ የሚቀርብ"
          payload: "/new_conflict_report"
        - title: "📊 ግጭት ሪፖርት ሁኔታ"
          payload: "/ conflict_status"

  utter_vision_am:
    - text: "ሰላም፣ የዜግነት ክብር እና ህብረ-ብሄራዊ አንድነት አድጎ ማየት"
  utter_mission_am:
    - text: "የዜጋውን፣ የቤተሰብንና የማህበረሰብን ሰላምን በማስጠበቅና በማስከበር፣ ብሔራዊ መግባባትንና አገራዊ አንድነትን በማሳደግ፣ 
             የፌዴራል ስርዓቱን በማጠናከር፣ በቀድሞ ተገኝነት ግጭትን በማስተዳደር፣ ቀጣናዊና አህጉራዊ ትብብርና ትስስርን በማጎልበት እንዲሁም ተቋማዊነትን በማሳደግ ሁለንተናዊና ዘላቂ ሰላም መገንባት ነው፡፡"
  utter_values_am:
    - text: "ሀገር-ወዳድነት፣ ሰላማዊነት፣ ህጋዊነት፣ ምክንያታዊነት፣ ዓለም-አቀፋዊነት"
  utter_foundation_am:
    - text: "የሰላም ሚኒስቴር የኢትዮጵያ ፌደራላዊ ዲሞክራስያዊ ሪፐብሊክ የፌደራል መንግስት አስፈፃሚ አካላትን ስልጣንና ተግባር ለመወሰን በወጣው አዋጅ ቁጥር 1097/2011 አንቀፅ 13 ለመጀመሪያ ጊዜ ተቋቋመ፡፡ 
             በመቀጠልም በኢትዮጵያ ፌደራላዊ ዲሞክራሲያዊ ሪፐብሊክ የፌደራል መንግሥት አስፈፃሚ አካላትን ሥልጣንና ተግባር ለመወሰን በወጣው አዋጅ ቁጥር 1263/2014 እንደገና ተቋቁሟል፡፡"
  utter_goodbye_am:
    - text: "የሰላም ሚኒስቴር ቻትቦትን በመጠቀምዎ እናመሰግናለን!"
  utter_iamabot:
    - text: "I am a bot, powered by Rasa."

  # --- Responses for Incident Form (Amharic) ---
  utter_ask_title:
    - text: "እባክዎ የክስተቱን ርዕስ ያስገቡ። (ምሳሌ፡ በቦሌ አካባቢ የተነሳ ተቃውሞ)"

  utter_ask_description:
    - text: "ምን እንደተፈጠረ በዝርዝር ይግለጹ።"

  utter_ask_severity:
    - text: "የጉዳቱ ደረጃ ምን ያህል ነው?"
      button_type: vertical
      buttons:
        - title: "Low (ዝቅተኛ)"
          payload: "Low"
        - title: "Medium (መካከለኛ)"
          payload: "Medium"
        - title: "High (ከፍተኛ)"
          payload: "High"

  utter_ask_region:
    - text: "እባኮን ክስተቱ የተፈጠረበትን ክልል/ከተማ ያስገቡ? (ምሳሌ፡ አዲስ አበባ)"

  utter_ask_zone:
    - text: "እባኮን ክስተቱ የተፈጠረበትን ዞን/ክ/ከተማ ያስገቡ?"

  utter_ask_woreda:
    - text: "እባኮን ክስተቱ የተፈጠረበትን ወረዳ ያስገቡ?"

  utter_ask_kebele:
    - text: "እባኮን ክስተቱ የተፈጠረበትን ቀበሌ ያስገቡ?"


  utter_ask_specificArea:
    - text: "እባኮን ልዩ ቦታ ወይም ምልክት ያስገቡ? (ምሳሌ፡ ገበያ መግቢያ)"

  utter_ask_occurredAt:
    - text: "እባኮን ክስተቱ የተፈጠረበትን ቀን እና ሰዓት ያስገቡ? (ቀን/ ወር/ ዓ/ም)"

  utter_ask_contactPhone:
    - text: "እባኮን ስልክ ቁጥርዎን ያስገቡ?"

  utter_ask_anonymity:
    - text: "እባኮን ስምዎ እና ማንነትዎ በሚስጥር እንዲያዝ ይፈልጋሉ?"
      button_type: vertical
      buttons:
        - title: "አዎ (Yes)"
          payload: "true"
        - title: "አይ (No)"
          payload: "false"
  utter_ask_attachmentKeys:
    - text: "እባኮን የድጋፍ መረጃ ወይም ፎቶ ካለዎት ይላኩ? (ካልፈለጉ 'ለማለፍ' ወይም 'Skip' ብለው ይፃፉ)"
  utter_conflict_status_check:
    - text: "ይህ አገልግሎት በቅርቡ ይጀምራል። (This service is coming soon)"

actions:
  - validate_form_get_language
  - action_submit_language_form
  - action_submit_incident_form # You need to create this python action

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true