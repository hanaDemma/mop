version: "3.0"

intents:
  - start
  - greet_am
  - greet_oro
  - greet_som
  - greet_tgr
  - main_menu_am
  - main_menu_oro
  - main_menu_som
  - main_menu_tgr
  - goodbye_am
  - goodbye_oro
  - goodbye_som
  - goodbye_tgr
  - about_us_am
  - about_us_oro
  - about_us_som
  - about_us_tgr
  - vision_am
  - vision_oro
  - vision_som
  - vision_tgr
  - mission_am
  - mission_oro
  - mission_som
  - mission_tgr
  - values_am
  - values_oro
  - values_som
  - values_tgr
  - foundation_am
  - foundation_oro
  - foundation_som
  - foundation_tgr
  - conflict_report_am
  - conflict_report_oro
  - conflict_report_som
  - conflict_report_tgr
  - new_conflict_report_am
  - new_conflict_report_oro
  - new_conflict_report_som
  - new_conflict_report_tgr
  - conflict_status_am
  - conflict_status_oro
  - conflict_status_som
  - conflict_status_tgr
  - risk_scores_am
  - risk_scores_oro
  - risk_scores_som
  - risk_scores_tgr
  - FAQ_am
  - FAQ_oro
  - FAQ_som
  - FAQ_tgr
  - help_am
  - help_oro
  - help_som
  - help_tgr
  - inform_language
  - bot_challenge
  # New intent for the menu button
  - stop
  - affirm
  - deny



entities:
  - selected_language

slots:
  selected_language:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: selected_language

  attachmentKeys:
    type: text  # We store the input (text or link) here
    mappings:
      - type: from_text
        conditions:
         - active_loop: incident_form
           requested_slot: attachmentKeys
      - type: from_text 
        intent: nlu_fallback 
        conditions:
         - active_loop: incident_form
           requested_slot: attachmentKeys
  title:
    type: text
    mappings:
      - type: from_text
        conditions:
         - active_loop: incident_form
           requested_slot: title  # <--- THIS IS MISSING IN YOUR CODE

  description:
    type: text
    mappings:
      - type: from_text
        conditions:
         - active_loop: incident_form
           requested_slot: description

  severity:
    type: categorical
    values:
      - Low
      - Medium
      - High
    mappings:
      - type: from_text
        conditions:
         - active_loop: incident_form
           requested_slot: severity

  region:
    type: text
    mappings:
      - type: from_text
        conditions:
         - active_loop: incident_form
           requested_slot: region

  zone:
    type: text
    mappings:
      - type: from_text
        conditions:
         - active_loop: incident_form
           requested_slot: zone

  woreda:
    type: text
    mappings:
      - type: from_text
        conditions:
         - active_loop: incident_form
           requested_slot: woreda

  kebele:
    type: text
    mappings:
      - type: from_text
        conditions:
         - active_loop: incident_form
           requested_slot: kebele

  specificArea:
    type: text
    mappings:
      - type: from_text
        conditions:
         - active_loop: incident_form
           requested_slot: specificArea

  contactPhone:
    type: text
    mappings:
      - type: from_text
        conditions:
         - active_loop: incident_form
           requested_slot: contactPhone

  occurredAt:
    type: text
    mappings:
      - type: from_text
        conditions:
         - active_loop: incident_form
           requested_slot: occurredAt

  anonymity:
    type: bool
    mappings:
      - type: from_intent
        value: true
        intent: affirm
        conditions:
         - active_loop: incident_form
           requested_slot: anonymity
      - type: from_intent
        value: false
        intent: deny
        conditions:
         - active_loop: incident_form
           requested_slot: anonymity
      - type: from_text
        conditions:
         - active_loop: incident_form
           requested_slot: anonymity

forms:
  form_get_language:
    required_slots:
      - selected_language
  
  # New Incident Form
  incident_form:
    required_slots:
      - title
      - description
      - severity
      - region
      - zone
      - woreda
      - kebele
      - specificArea
      - occurredAt
      - contactPhone
      - anonymity
      - attachmentKeys

responses:
  utter_ask_selected_language:
  - text: "እባክዎን ቋንቋዎን ይምረጡ / Please select your language:"
    button_type: vertical
    buttons:
      - title: "አማርኛ"
        payload: '/inform_language{{"selected_language":"Amharic"}}'
      - title: "Afaan Oromoo"
        payload: '/inform_language{{"selected_language":"Afaan Oromoo"}}'
      - title: "ትግርኛ"
        payload: '/inform_language{{"selected_language":"Tigrinya"}}'
      - title: "Qafaraf"
        payload: '/inform_language{{"selected_language":"Afar"}}'
      - title: "Soomaaliga"
        payload: '/inform_language{{"selected_language":"Somali"}}'
  
  utter_welcome_am:
  - image: https://upload.wikimedia.org/wikipedia/commons/2/27/Ministry_of_Peace_Logo_Ethiopia.png
    text: እንኳን ወደ ሰላም ሚኒስትር በደህና መጡ። የምናቀርባቸውን አገልግሎቶች በተመለከተ ማንኛውንም መረጃ እየፈለጉ ነው?

  utter_welcome_oro:
